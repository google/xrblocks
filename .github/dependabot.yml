version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Enforce a 3-4 week cooldown on newly published npm versions to ensure supply chain stability
    cooldown:
      default-days: 21
      semver-major-days: 30
      semver-minor-days: 21
      semver-patch-days: 21
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      ci-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
