<!doctype html>
<html lang="en">
  <head>
    <title>Spatial UI | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../../main.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "../../../build/xrblocks.js"
        }
      }
    </script>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const CARD_SIZE = {width: 0.56, height: 0.58};

      function createHeader(icon, title, subtitle) {
        return new xb.UIPanel({
          style: {
            width: '100%',
            flexDirection: 'row',
            alignItems: 'center',
            gap: 14,
          },
          children: [
            new xb.UIIcon({
              icon,
              style: {width: 44, height: 44},
            }),
            new xb.UIPanel({
              style: {
                flexGrow: 1,
                flexDirection: 'column',
                alignItems: 'flex-start',
                gap: 4,
              },
              children: [
                new xb.UIText({
                  text: title,
                  style: {fontSize: 28, fontWeight: 'bold'},
                }),
                new xb.UIText({
                  text: subtitle,
                  style: {fontSize: 15, opacity: 0.72},
                }),
              ],
            }),
          ],
        });
      }

      function createFeature(icon, title, description) {
        return new xb.UIPanel({
          style: {
            width: '100%',
            flexDirection: 'row',
            alignItems: 'center',
            gap: 14,
            padding: 12,
            backgroundColor: 'rgba(255, 255, 255, 0.07)',
            borderRadius: 18,
          },
          children: [
            new xb.UIIcon({icon, style: {width: 34, height: 34}}),
            new xb.UIPanel({
              style: {
                flexGrow: 1,
                flexDirection: 'column',
                alignItems: 'flex-start',
                gap: 4,
              },
              children: [
                new xb.UIText({
                  text: title,
                  style: {fontSize: 18, fontWeight: 'bold'},
                }),
                new xb.UIText({
                  text: description,
                  style: {fontSize: 14, opacity: 0.72},
                }),
              ],
            }),
          ],
        });
      }

      class MainScript extends xb.Script {
        init() {
          const light = new THREE.HemisphereLight(0xffffff, 0x666666, 2.6);
          this.add(light);

          const lightPreview = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 32, 16),
            new THREE.MeshStandardMaterial({color: 0x55ccff})
          );
          lightPreview.position.set(0, 0.75, -1.1);
          this.add(lightPreview);

          const activity = new xb.UIText({
            text: 'Choose an action.',
            style: {
              width: '100%',
              fontSize: 16,
              textAlign: 'center',
              opacity: 0.72,
            },
          });

          const exploreCard = new xb.UICard({
            size: CARD_SIZE,
            manipulation: true,
            edge: {scale: true},
            style: {justifyContent: 'flex-start', gap: 18},
            children: [
              createHeader('explore', 'Explore', 'Images, layout, and actions'),
              new xb.UIImage({
                src: 'https://picsum.photos/id/1018/900/600',
                ariaLabel: 'Mountain lake landscape',
                style: {
                  width: '92%',
                  height: 230,
                  alignSelf: 'center',
                  objectFit: 'cover',
                  borderRadius: 22,
                },
              }),
              new xb.UIText({
                text: 'Build spatial interfaces from familiar flex layouts.',
                style: {fontSize: 18, lineHeight: 1.35},
              }),
              new xb.UIPanel({
                style: {width: '100%', flexDirection: 'row', gap: 12},
                children: [
                  new xb.UIButton({
                    label: 'Favorite',
                    icon: 'favorite',
                    style: {flexGrow: 1},
                    onClick: () => (activity.text = 'Saved to favorites.'),
                  }),
                  new xb.UIButton({
                    label: 'Share',
                    icon: 'share',
                    style: {flexGrow: 1},
                    onClick: () => (activity.text = 'Share action selected.'),
                  }),
                ],
              }),
              activity,
            ],
          });

          const lightValue = new xb.UIText({
            text: '65%',
            style: {fontSize: 22, fontWeight: 'bold'},
          });
          const lightSlider = new xb.UISlider({
            ariaLabel: 'Scene light level',
            min: 0,
            max: 100,
            step: 5,
            value: 65,
            style: {width: '100%', height: 48},
            onInput: (value) => {
              lightValue.text = `${value}%`;
              light.intensity = value * 0.04;
            },
          });

          let colorful = false;
          let themeButton;
          themeButton = new xb.UIButton({
            label: 'Try colorful',
            icon: 'palette',
            onClick: () => {
              colorful = !colorful;
              xb.ui.theme = colorful ? 'colorful' : 'grayGlass';
              themeButton.label = colorful ? 'Use glass' : 'Try colorful';
            },
          });

          const tuneCard = new xb.UICard({
            size: CARD_SIZE,
            manipulation: true,
            edge: {scale: true},
            style: {justifyContent: 'flex-start', gap: 18},
            children: [
              createHeader('tune', 'Tune', 'Live controls and theme state'),
              new xb.UIPanel({
                style: {
                  width: '100%',
                  flexDirection: 'row',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  marginTop: 8,
                },
                children: [
                  new xb.UIText({
                    text: 'Scene light',
                    style: {fontSize: 20, fontWeight: 'bold'},
                  }),
                  lightValue,
                ],
              }),
              lightSlider,
              new xb.UIText({
                text: 'Drag the slider to update the scene immediately.',
                style: {fontSize: 16, lineHeight: 1.4, opacity: 0.72},
              }),
              themeButton,
              new xb.UIButton({
                label: 'Unavailable action',
                icon: 'block',
                disabled: true,
              }),
            ],
          });

          let cards;
          const resetDemo = () => {
            colorful = false;
            xb.ui.theme = 'grayGlass';
            themeButton.label = 'Try colorful';
            activity.text = 'Choose an action.';
            lightSlider.value = 65;
            lightValue.text = '65%';
            light.intensity = 2.6;
            cards.forEach((card) => {
              const initial = card.userData.initialTransform;
              card.position.copy(initial.position);
              card.quaternion.copy(initial.quaternion);
              card.scale.copy(initial.scale);
            });
          };

          const featuresCard = new xb.UICard({
            size: CARD_SIZE,
            manipulation: true,
            edge: {scale: true},
            style: {justifyContent: 'flex-start', gap: 18},
            children: [
              createHeader('view_in_ar', 'Spatial', 'Interaction built in'),
              createFeature(
                'open_with',
                'Move',
                'Drag any card through space.'
              ),
              createFeature(
                'aspect_ratio',
                'Resize',
                'Grab a card edge to scale.'
              ),
              createFeature(
                'widgets',
                'Compose',
                'Nest controls with flex layout.'
              ),
              new xb.UIText({
                text: 'Point, pinch, click, or use a controller.',
                style: {fontSize: 16, textAlign: 'center', opacity: 0.72},
              }),
              new xb.UIButton({
                label: 'Reset demo',
                icon: 'restart_alt',
                onClick: resetDemo,
              }),
            ],
          });

          cards = [exploreCard, tuneCard, featuresCard];
          const positions = [-0.64, 0, 0.64];
          const rotations = [0.18, 0, -0.18];
          cards.forEach((card, index) => {
            card.name = ['Explore card', 'Tune card', 'Features card'][index];
            card.position.set(positions[index], 1.48, -1.2);
            card.rotation.y = rotations[index];
            card.userData.initialTransform = {
              position: card.position.clone(),
              quaternion: card.quaternion.clone(),
              scale: card.scale.clone(),
            };
            this.add(card);
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Spatial UI');
        xb.add(new MainScript());
        xb.init(options);
      });
    </script>
  </body>
</html>
