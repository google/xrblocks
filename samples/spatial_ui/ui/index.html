<!doctype html>
<html lang="en">
  <head>
    <title>Spatial UI | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../../main.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "../../../build/xrblocks.js"
        }
      }
    </script>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const CARD_SIZE = {width: 0.54, height: 'auto'};
      // A scroll view has no natural height, so the scrolling card starts at a
      // fixed one and may shrink to a smaller minimum than its content.
      const SCROLLING_CARD_SIZE = {width: CARD_SIZE.width, height: 0.68};

      const SUBGROUP_BG = 'rgba(225, 226, 232, 0.015)';
      const SECONDARY_BUTTON_BG = 'rgba(225, 226, 232, 0.06)';
      const MUTED_TEXT = '#989a9f';

      function createHeader(icon, title, subtitle) {
        return new xb.UIPanel({
          style: {
            width: '100%',
            height: 56,
            flexDirection: 'row',
            alignItems: 'center',
            gap: 4,
          },
          children: [
            new xb.UIPanel({
              style: {
                width: 56,
                height: 56,
                justifyContent: 'center',
                alignItems: 'center',
                flexShrink: 0,
              },
              children: [
                new xb.UIIcon({
                  icon,
                  style: {width: 32, height: 32, color: '#e1e2e8'},
                }),
              ],
            }),
            new xb.UIPanel({
              style: {
                flexGrow: 1,
                flexDirection: 'column',
                alignItems: 'flex-start',
                justifyContent: 'center',
                gap: 4,
              },
              children: [
                new xb.UIText({
                  text: title,
                  style: {
                    fontSize: 24,
                    lineHeight: '32px',
                    color: '#e1e2e8',
                  },
                }),
                new xb.UIText({
                  text: subtitle,
                  style: {
                    fontSize: 15,
                    fontWeight: 'medium',
                    lineHeight: '18px',
                    color: '#c4c6cc',
                  },
                }),
              ],
            }),
          ],
        });
      }

      function createTitledGroupSection(
        headerText,
        rows,
        {applyStackCornerRadii = true} = {}
      ) {
        if (applyStackCornerRadii && rows.length > 0) {
          rows.forEach((row, idx) => {
            const topR = idx === 0 ? 16 : 4;
            const botR = idx === rows.length - 1 ? 16 : 4;
            Object.assign(row.style, {
              borderTopLeftRadius: topR,
              borderTopRightRadius: topR,
              borderBottomRightRadius: botR,
              borderBottomLeftRadius: botR,
            });
          });
        }

        return new xb.UIPanel({
          style: {
            flexDirection: 'column',
            gap: 10,
          },
          children: [
            new xb.UIText({
              text: headerText,
              style: {
                fontSize: 14,
                lineHeight: '20px',
                color: MUTED_TEXT,
              },
            }),
            new xb.UIPanel({
              style: {
                flexDirection: 'column',
                gap: 4,
              },
              children: rows,
            }),
          ],
        });
      }

      function createFeatureRow(icon, title, description) {
        return new xb.UIPanel({
          style: {
            height: 78,
            flexDirection: 'row',
            alignItems: 'flex-start',
            gap: 16,
            padding: 16,
            backgroundColor: SUBGROUP_BG,
            borderRadius: 16,
          },
          children: [
            new xb.UIIcon({
              icon,
              style: {width: 24, height: 24, color: '#e1e2e8', flexShrink: 0},
            }),
            new xb.UIPanel({
              style: {
                flexGrow: 1,
                flexDirection: 'column',
                alignItems: 'flex-start',
                gap: 2,
              },
              children: [
                new xb.UIText({
                  text: title,
                  style: {
                    fontSize: 16,
                    lineHeight: '24px',
                    color: '#e1e2e8',
                  },
                }),
                new xb.UIText({
                  text: description,
                  style: {
                    fontSize: 14,
                    lineHeight: '20px',
                    color: MUTED_TEXT,
                  },
                }),
              ],
            }),
          ],
        });
      }

      class MainScript extends xb.Script {
        init() {
          const light = new THREE.HemisphereLight(0xffffff, 0x666666, 2.6);
          this.add(light);

          const lightPreview = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 32, 16),
            new THREE.MeshStandardMaterial({color: 0x55ccff})
          );
          lightPreview.position.set(0, 0.75, -1.1);
          this.add(lightPreview);

          const activity = new xb.UIText({
            text: 'Choose an action.',
            style: {
              width: '100%',
              fontSize: 14,
              lineHeight: '20px',
              textAlign: 'center',
              color: '#c4c6cc',
            },
          });

          // The body scrolls, so this card can be resized smaller than its
          // content while keeping a minimum scroll viewport height.
          const exploreBody = new xb.UIScrollView({
            ariaLabel: 'Explore details',
            style: {flexGrow: 1, flexBasis: 0, minHeight: 160, gap: 18},
            children: [
              new xb.UIImage({
                src: 'https://picsum.photos/id/1018/900/600',
                ariaLabel: 'Mountain lake landscape',
                style: {
                  width: '100%',
                  height: 240,
                  objectFit: 'cover',
                  borderRadius: 16,
                },
              }),
              new xb.UIText({
                text: 'Build spatial interfaces from familiar flex layouts.',
                style: {
                  fontSize: 16,
                  lineHeight: '24px',
                  color: '#e1e2e8',
                },
              }),
              createTitledGroupSection('International & Emoji', [
                createFeatureRow(
                  'rocket_launch',
                  'Emojis 🚀✨',
                  'Inline emoji and rich glyph support.'
                ),
                createFeatureRow(
                  'translate',
                  '你好！',
                  'Multi-script Unicode text rendering.'
                ),
              ]),
            ],
          });

          const exploreCard = new xb.UICard({
            size: SCROLLING_CARD_SIZE,
            manipulation: true,
            edge: true,
            style: {justifyContent: 'flex-start', gap: 24},
            children: [
              new xb.UIExitButton(),
              createHeader('explore', 'Explore', 'Images, layout, and actions'),
              exploreBody,
              new xb.UIPanel({
                style: {width: '100%', flexDirection: 'row', gap: 8},
                children: [
                  new xb.UIButton({
                    label: 'Favorite',
                    icon: 'favorite',
                    style: {flexGrow: 1, flexBasis: 0},
                    onClick: () => (activity.text = 'Saved to favorites.'),
                  }),
                  new xb.UIButton({
                    label: 'Share',
                    icon: 'share',
                    style: {
                      flexGrow: 1,
                      flexBasis: 0,
                      backgroundColor: SECONDARY_BUTTON_BG,
                      color: '#e1e2e8',
                      ':hover': {backgroundColor: 'rgba(225, 226, 232, 0.12)'},
                    },
                    onClick: () => (activity.text = 'Share action selected.'),
                  }),
                ],
              }),
              activity,
            ],
          });

          const lightValue = new xb.UIText({
            text: '65%',
            style: {
              fontSize: 16,
              lineHeight: '24px',
              color: '#e1e2e8',
              textAlign: 'right',
            },
          });
          const lightSlider = new xb.UISlider({
            ariaLabel: 'Scene light level',
            min: 0,
            max: 100,
            step: 5,
            value: 65,
            style: {width: '100%', height: 24},
            onInput: (value) => {
              lightValue.text = `${value}%`;
              light.intensity = value * 0.04;
            },
          });

          const lightSliderRow = new xb.UIPanel({
            style: {
              flexDirection: 'column',
              justifyContent: 'center',
              gap: 8,
              padding: 16,
              backgroundColor: SUBGROUP_BG,
              borderRadius: 16,
            },
            children: [
              new xb.UIPanel({
                style: {
                  height: 24,
                  flexDirection: 'row',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                },
                children: [
                  new xb.UIText({
                    text: 'Scene light',
                    style: {
                      fontSize: 16,
                      lineHeight: '24px',
                      color: '#e1e2e8',
                    },
                  }),
                  lightValue,
                ],
              }),
              lightSlider,
              new xb.UIText({
                text: 'Drag the slider to update the scene immediately.',
                style: {
                  fontSize: 14,
                  lineHeight: '20px',
                  color: MUTED_TEXT,
                },
              }),
            ],
          });

          let colorful = false;
          let themeButton;
          themeButton = new xb.UIButton({
            label: 'Try colorful',
            icon: 'palette',
            onClick: () => {
              colorful = !colorful;
              xb.ui.theme = colorful ? 'colorful' : 'grayGlass';
              themeButton.label = colorful ? 'Use glass' : 'Try colorful';
            },
          });

          const tuneCard = new xb.UICard({
            size: CARD_SIZE,
            manipulation: true,
            edge: true,
            style: {justifyContent: 'flex-start', gap: 24},
            children: [
              createHeader('tune', 'Tune', 'Live controls and theme state'),
              createTitledGroupSection('Controls', [
                lightSliderRow,
                createFeatureRow(
                  'palette',
                  'Theme preset',
                  'Switch between XR-Studio glass and colorful themes.'
                ),
              ]),
              new xb.UIPanel({
                style: {
                  flexDirection: 'column',
                  gap: 8,
                },
                children: [
                  themeButton,
                  new xb.UIButton({
                    label: 'Unavailable action',
                    icon: 'block',
                    disabled: true,
                  }),
                ],
              }),
            ],
          });

          let cards;
          const resetDemo = () => {
            colorful = false;
            xb.ui.theme = 'grayGlass';
            themeButton.label = 'Try colorful';
            activity.text = 'Choose an action.';
            lightSlider.value = 65;
            lightValue.text = '65%';
            light.intensity = 2.6;
            cards.forEach((card) => {
              const initial = card.userData.initialTransform;
              card.position.copy(initial.position);
              card.quaternion.copy(initial.quaternion);
              card.scale.copy(initial.scale);
              card.size = {...initial.size};
            });
          };

          const featuresCard = new xb.UICard({
            size: CARD_SIZE,
            manipulation: true,
            edge: true,
            style: {justifyContent: 'flex-start', gap: 24},
            children: [
              createHeader('view_in_ar', 'Spatial', 'Interaction built in'),
              createTitledGroupSection('Interactions', [
                createFeatureRow(
                  'open_with',
                  'Move',
                  'Drag a panel from the outside edge.'
                ),
                createFeatureRow(
                  'aspect_ratio',
                  'Resize',
                  'Drag a corner of the panel to resize it.'
                ),
                createFeatureRow(
                  'widgets',
                  'Compose',
                  'Nest controls with flex layout.'
                ),
              ]),
              new xb.UIText({
                text: 'Point, pinch, click, or use a controller.',
                style: {
                  fontSize: 14,
                  lineHeight: '20px',
                  textAlign: 'center',
                  color: '#c4c6cc',
                },
              }),
              new xb.UIButton({
                label: 'Reset demo',
                icon: 'restart_alt',
                style: {
                  backgroundColor: SECONDARY_BUTTON_BG,
                  color: '#e1e2e8',
                  ':hover': {backgroundColor: 'rgba(225, 226, 232, 0.12)'},
                },
                onClick: resetDemo,
              }),
            ],
          });

          cards = [exploreCard, tuneCard, featuresCard];
          const positions = [-0.64, 0, 0.64];
          const rotations = [0.18, 0, -0.18];
          cards.forEach((card, index) => {
            card.name = ['Explore card', 'Tune card', 'Features card'][index];
            card.position.set(positions[index], 1.48, -1.2);
            card.rotation.y = rotations[index];
            card.userData.initialTransform = {
              position: card.position.clone(),
              quaternion: card.quaternion.clone(),
              scale: card.scale.clone(),
              size: {...card.size},
            };
            this.add(card);
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.setAppTitle('Spatial UI');
        xb.add(new MainScript());
        xb.init(options);
      });
    </script>
  </body>
</html>
