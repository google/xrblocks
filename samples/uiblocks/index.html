<!doctype html>
<html lang="en">
  <head>
    <title>UI Blocks Integration Sample | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "../../build/xrblocks.js"
        }
      }
    </script>
  </head>

  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const flashGradient = {
        gradientType: 'linear',
        rotation: 90,
        stops: [
          {position: 0, color: '#4796e3'},
          {position: 0.5, color: '#9177c7'},
          {position: 1, color: '#ca6673'},
        ],
      };

      function createIconButton(iconName) {
        let button;
        button = new xb.UIButton({
          ariaLabel: iconName,
          onClick: () => {
            button.style.backgroundColor = flashGradient;
            button.style[':hover'].backgroundColor = flashGradient;
            setTimeout(() => {
              button.style.backgroundColor = '#444444';
              button.style[':hover'].backgroundColor = '#666666';
            }, 200);
          },
          style: {
            width: 160,
            height: 160,
            alignItems: 'center',
            justifyContent: 'center',
            backgroundColor: '#444444',
            borderRadius: 40,
            ':hover': {backgroundColor: '#666666'},
          },
          children: [
            new xb.UIIcon({
              icon: iconName,
              style: {width: 80, height: 80, color: 'white'},
            }),
          ],
        });
        return button;
      }

      class MainScript extends xb.Script {
        init() {
          this.add(new THREE.HemisphereLight(0xffffff, 0x666666, 3));

          const card = new xb.UICard({
            size: {width: 1.2, height: 1.0},
            manipulation: true,
            edge: {translateFromSurface: true},
            style: {
              padding: 50,
              gap: 50,
              flexDirection: 'column',
              justifyContent: 'flex-start',
              alignItems: 'center',
              backgroundColor: 'rgba(5, 5, 5, 0.6)',
              innerShadowColor: 'rgba(150, 150, 150, 0.05)',
              innerShadowBlur: 96,
              borderColor: {
                gradientType: 'linear',
                rotation: 90,
                stops: [
                  {position: 0, color: 'rgba(255, 255, 255, 0.5)'},
                  {position: 0.5, color: 'rgba(255, 255, 255, 0.25)'},
                  {position: 1, color: 'rgba(255, 255, 255, 0.35)'},
                ],
              },
              borderWidth: 4,
              borderRadius: 50,
            },
          });
          card.name = 'ProfileCard';
          card.position.set(0, 1.5, -1.5);

          card.add(
            new xb.UIText({
              text: 'Welcome to UI Blocks',
              style: {
                fontSize: 64,
                fontWeight: 'bold',
                color: '#4796e3',
              },
            }),
            new xb.UIImage({
              src: 'https://picsum.photos/id/10/400/300',
              style: {width: 400, height: 300, borderRadius: 40},
            })
          );

          const iconPanel = new xb.UIPanel({
            style: {
              width: '100%',
              height: 120,
              flexDirection: 'row',
              gap: 60,
              alignItems: 'center',
              justifyContent: 'center',
            },
          });
          iconPanel.add(createIconButton('favorite'), createIconButton('star'));
          card.add(iconPanel);

          card.add(
            new xb.UIText({
              text: 'This sample card is built using the retained XR Blocks UI, featuring a panel, image, icons, and text.',
              style: {
                width: '100%',
                flexShrink: 1,
                fontSize: 48,
                color: 'white',
                textAlign: 'center',
              },
            })
          );

          this.add(card);
        }
      }

      const options = new xb.Options();
      options.setAppTitle('UI Blocks Sample');
      xb.add(new MainScript());
      await xb.init(options);
    </script>
  </body>
</html>
