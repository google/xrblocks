<!doctype html>
<html lang="en">
  <head>
    <title>Agent Hands | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <link rel="stylesheet" href="../../samples/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "../../build/xrblocks.js",
          "xrblocks/addons/": "../../build/addons/",
          "ai": "https://esm.sh/ai@7.0.122?bundle&deps=zod@3.25.76",
          "@ai-sdk/google": "https://esm.sh/@ai-sdk/google@4.0.100?bundle&deps=zod@3.25.76"
        }
      }
    </script>
  </head>
  <body>
    <div
      id="status"
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 50;
        max-width: 420px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(20, 20, 30, 0.78);
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
      "
    >
      the agent will gesture as it speaks...
    </div>
    <button
      id="talk"
      style="
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 50;
        padding: 10px 18px;
        border: none;
        border-radius: 24px;
        background: #9177c7;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        display: none;
      "
    >
      🎙️ Talk
    </button>
    <script type="module" src="main.js"></script>
  </body>
</html>
