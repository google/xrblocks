<!doctype html>
<html lang="en">
  <head>
    <title>Coordinate Inspector | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../../samples/main.css" />
    <style>
      #coordinates {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 100;
        margin: 0;
        padding: 12px 16px;
        border: 1px solid rgb(148 163 184 / 55%);
        border-radius: 8px;
        background: rgb(15 23 42 / 92%);
        box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
        color: #f8fafc;
        font: 16px/1.5 monospace;
        pointer-events: none;
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
          "three-pathfinding": "https://cdn.jsdelivr.net/npm/three-pathfinding@1.3.0/dist/three-pathfinding.module.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "../../build/xrblocks.js"
        }
      }
    </script>
  </head>
  <body>
    <pre id="coordinates"></pre>
    <script type="module" src="main.js"></script>
  </body>
</html>
