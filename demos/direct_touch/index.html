<!doctype html>
<html lang="en">
  <head>
    <title>Direct Touch Lab | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <link rel="stylesheet" href="../demo.css" />
    <style>
      #help {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        max-width: 390px;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 10px;
        padding: 10px 14px;
        background: rgb(8 15 28 / 82%);
        color: #e2e8f0;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
      }

      #help strong {
        color: #67e8f9;
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "xrblocks": "../../build/xrblocks.js?demo=direct-touch-lab-1",
          "xrblocks/addons/": "../../build/addons/"
        }
      }
    </script>
  </head>

  <body>
    <div id="help">
      <strong>Simulator:</strong> WASD moves the active hand, Q/E moves it
      up/down, T changes hands, and Space toggles pinch.
    </div>
    <script type="module" src="main.js?demo=direct-touch-lab-1"></script>
  </body>
</html>
