<!doctype html>
<html lang="en">
  <head>
    <title>Spatial Anchors | XR Blocks</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../../samples/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "../../build/xrblocks.js",
          "xrblocks/addons/": "../../build/addons/"
        }
      }
    </script>
  </head>

  <body>
    <style>
      /* One wrapping bar rather than three absolutely positioned boxes, so the
         controls stay reachable on a narrow phone screen instead of sliding
         under each other. */
      #controls {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      #status {
        flex: 1 1 220px;
        min-width: 0;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(16, 14, 26, 0.9);
        color: #d7d2ea;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #controls button {
        flex: 0 0 auto;
        padding: 10px 18px;
        border: none;
        border-radius: 24px;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #drop {
        background: #6a5acd;
      }
      #forget {
        background: #3a3550;
      }
      /* Cross-links to the sibling anchor demos, matching the picker links
         in samples/netblocks. DOM only, so they are a way in before the
         session starts rather than navigation from inside it. */
      #siblings {
        flex: 1 0 100%;
        display: flex;
        gap: 12px;
        font:
          12px/1.4 system-ui,
          sans-serif;
        color: #8d86a8;
      }
      #siblings a {
        color: #b9a7ff;
        text-decoration: none;
        border-bottom: 1px dotted #6a5acd;
      }
      #siblings a:hover {
        color: #fff;
      }
      #siblings b {
        color: #d7d2ea;
        font-weight: 600;
      }
    </style>
    <div id="controls">
      <div id="status">starting…</div>
      <button id="drop">Drop marker</button>
      <button id="forget">Clear markers</button>
      <nav id="siblings">
        <span><b>markers</b></span>
        <a href="../anchors_notes/">notes →</a>
        <a href="../anchors_gallery/">gallery →</a>
      </nav>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
